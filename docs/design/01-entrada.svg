<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1100" viewBox="0 0 1740 1100"><rect x="0" y="0" width="1740" height="1100" rx="0" fill="#E7EBDF" stroke="none"/><text x="40" y="48" font-size="15" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">MURPHY / EXPERIÊNCIA OFFLINE</text><text x="40" y="87" font-size="30" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">01 — Começar juntos</text><text x="40" y="118" font-size="16" font-weight="500" fill="#63746C" font-family="Arial, sans-serif">Preparação, permissões e sessão · Proposta visual · Dados ilustrativos · Não implementado</text><text x="40" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">01 · Boas-vindas</text><g transform="translate(40 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="96" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">MURPHY</text><text x="24" y="160" font-size="31" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">A trilha continua.</text><text x="24" y="200" font-size="31" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">A conexão também.</text><text x="24" y="240" font-size="15" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Converse com seu grupo por Bluetooth,</text><text x="24" y="264" font-size="15" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">mesmo sem internet ou sinal de celular.</text><rect x="24" y="315" width="342" height="220" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><path d="M96 423L194 377L292 446M96 423L194 491L292 446" fill="none" stroke="#163D35" stroke-width="3" /><circle cx="96" cy="423" r="22" fill="#D9ED97" stroke="#163D35" stroke-width="2"/><text x="96" text-anchor="middle" y="428" font-size="14" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">V</text><text x="96" text-anchor="middle" y="466" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Você</text><circle cx="194" cy="377" r="22" fill="#D9ED97" stroke="#163D35" stroke-width="2"/><text x="194" text-anchor="middle" y="382" font-size="14" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">B</text><text x="194" text-anchor="middle" y="420" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Bia</text><circle cx="292" cy="446" r="22" fill="#D9ED97" stroke="#163D35" stroke-width="2"/><text x="292" text-anchor="middle" y="451" font-size="14" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">C</text><text x="292" text-anchor="middle" y="489" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Caio</text><circle cx="194" cy="491" r="22" fill="#D9ED97" stroke="#163D35" stroke-width="2"/><text x="194" text-anchor="middle" y="496" font-size="14" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">L</text><text x="194" text-anchor="middle" y="534" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Lia</text><rect x="24" y="558" width="342" height="94" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="589" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Entre pessoas. Sem servidor.</text><text x="42" y="618" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">O alcance depende dos aparelhos,</text><text x="42" y="641" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">do terreno e dos vizinhos disponíveis.</text><rect x="24" y="676" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="709" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Começar</text><text x="24" y="753" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Conceito de produto · Não substitui resgate</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="462" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">02 · Permissões</text><g transform="translate(462 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="93" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">PREPARAÇÃO</text><text x="24" y="136" font-size="28" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Prepare a conexão</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Você controla as permissões.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Nada de prometer alcance ilimitado.</text><rect x="24" y="232" width="342" height="124" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="263" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Bluetooth e dispositivos próximos</text><text x="42" y="292" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Para encontrar e trocar mensagens</text><text x="42" y="315" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">com as pessoas perto de você.</text><rect x="24" y="374" width="342" height="124" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="405" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Sem rastreamento por padrão</text><text x="42" y="434" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Localização não faz parte deste fluxo.</text><text x="42" y="457" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Permissões variam entre Android e iOS.</text><rect x="24" y="524" width="342" height="36" rx="18" fill="#FFF0C9" stroke="none"/><text x="40" y="548" font-size="13" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Bluetooth ainda não autorizado</text><text x="24" y="590" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Se negar a permissão, explicamos como</text><text x="24" y="613" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">ativar nas configurações do aparelho.</text><rect x="24" y="676" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="709" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Permitir Bluetooth</text><text x="118" y="752" font-size="14" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Continuar sem conectar</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="884" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">03 · Criar grupo</text><g transform="translate(884 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="93" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">SEU GRUPO</text><text x="24" y="136" font-size="28" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Dê nome à aventura</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Organize a sessão antes de sair.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Identidade e grupos são propostos.</text><text x="24" y="249" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">NOME DO GRUPO</text><rect x="24" y="266" width="342" height="58" rx="16" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="302" font-size="18" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Trilha da Pedra</text><text x="24" y="369" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">COMO VOCÊ APARECE</text><rect x="24" y="386" width="342" height="58" rx="16" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="422" font-size="18" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Antônio</text><rect x="24" y="480" width="342" height="119" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="511" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Uma rede sem chefe obrigatório</text><text x="42" y="540" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Todos podem encaminhar mensagens.</text><text x="42" y="563" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Criar o grupo não torna você líder.</text><rect x="24" y="676" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="709" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Criar sessão</text><text x="114" y="752" font-size="13" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Já tenho um grupo · Entrar</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="1306" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">04 · Encontrar grupo</text><g transform="translate(1306 181)"><rect x="0