<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1100" viewBox="0 0 1740 1100"><rect x="0" y="0" width="1740" height="1100" rx="0" fill="#E7EBDF" stroke="none"/><text x="40" y="48" font-size="15" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">MURPHY / OFFLINE EXPERIENCE</text><text x="40" y="87" font-size="30" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">01 — Start together</text><text x="40" y="118" font-size="16" font-weight="500" fill="#63746C" font-family="Arial, sans-serif">Setup, permissions and session · Design proposal · Sample data · Not implemented</text><text x="40" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">01 · Welcome</text><g transform="translate(40 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="96" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">MURPHY</text><text x="24" y="160" font-size="31" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">The trail goes on.</text><text x="24" y="200" font-size="31" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">So does your connection.</text><text x="24" y="240" font-size="15" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Talk to your group over Bluetooth,</text><text x="24" y="264" font-size="15" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">even without internet or cell service.</text><rect x="24" y="315" width="342" height="220" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><path d="M96 423L194 377L292 446M96 423L194 491L292 446" fill="none" stroke="#163D35" stroke-width="3" /><circle cx="96" cy="423" r="22" fill="#D9ED97" stroke="#163D35" stroke-width="2"/><text x="96" text-anchor="middle" y="428" font-size="14" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Y</text><text x="96" text-anchor="middle" y="466" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">You</text><circle cx="194" cy="377" r="22" fill="#D9ED97" stroke="#163D35" stroke-width="2"/><text x="194" text-anchor="middle" y="382" font-size="14" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">B</text><text x="194" text-anchor="middle" y="420" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Bia</text><circle cx="292" cy="446" r="22" fill="#D9ED97" stroke="#163D35" stroke-width="2"/><text x="292" text-anchor="middle" y="451" font-size="14" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">C</text><text x="292" text-anchor="middle" y="489" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Caio</text><circle cx="194" cy="491" r="22" fill="#D9ED97" stroke="#163D35" stroke-width="2"/><text x="194" text-anchor="middle" y="496" font-size="14" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">L</text><text x="194" text-anchor="middle" y="534" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Lia</text><rect x="24" y="558" width="342" height="94" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="589" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Peer to peer. No server.</text><text x="42" y="618" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Range depends on devices,</text><text x="42" y="641" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">terrain and nearby peers.</text><rect x="24" y="676" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="709" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Get started</text><text x="24" y="753" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Product concept · Not a rescue service</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="462" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">02 · Permissions</text><g transform="translate(462 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="93" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">SETUP</text><text x="24" y="136" font-size="28" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Set up your connection</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">You control the permissions.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Range is never unlimited.</text><rect x="24" y="232" width="342" height="124" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="263" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Bluetooth and nearby devices</text><text x="42" y="292" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Find nearby devices and exchange</text><text x="42" y="315" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">messages with your group.</text><rect x="24" y="374" width="342" height="124" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="405" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">No tracking by default</text><text x="42" y="434" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Location is not part of this flow.</text><text x="42" y="457" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Permissions differ on Android and iOS.</text><rect x="24" y="524" width="342" height="36" rx="18" fill="#FFF0C9" stroke="none"/><text x="40" y="548" font-size="13" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Bluetooth permission needed</text><text x="24" y="590" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">If you decline, we will explain how</text><text x="24" y="613" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">to enable it in your device settings.</text><rect x="24" y="676" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="709" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Allow Bluetooth</text><text x="118" y="752" font-size="14" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Continue without connecting</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="884" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">03 · Create a group</text><g transform="translate(884 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="93" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">YOUR GROUP</text><text x="24" y="136" font-size="28" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Name your adventure</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Set up a session before heading out.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Identity and groups are planned.</text><text x="24" y="249" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">GROUP NAME</text><rect x="24" y="266" width="342" height="58" rx="16" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="302" font-size="18" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Stone Trail</text><text x="24" y="369" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">YOUR DISPLAY NAME</text><rect x="24" y="386" width="342" height="58" rx="16" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="422" font-size="18" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Antônio</text><rect x="24" y="480" width="342" height="119" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="511" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">No required leader</text><text x="42" y="540" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Every device can relay messages.</text><text x="42" y="563" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Creating a group does not make a leader.</text><rect x="24" y="676" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="709" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Create a session</text><text x="114" y="752" font-size="13" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Already have a group? Join</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="1306" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">04 · Find a group</text><g transform="translate(1306 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="93" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">NEARBY</text><text x="24" y="136" font-size="28" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Find your group</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Search nearby over Bluetooth.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Sample discovered session.</text><rect x="24" y="224" width="342" height="36" rx="18" fill="#D9ED97" stroke="none"/><text x="40" y="248" font-size="13" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Looking for nearby sessions…</text><rect x="24" y="284" width="342" height="72" rx="18" fill="#FFFFFF" stroke="#DDE4DA"/><rect x="40" y="300" width="40" height="40" rx="13" fill="#D9ED97" stroke="none"/><text x="60" text-anchor="middle" y="326" font-size="16" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">T</text><text x="94" y="313" font-size="16" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Stone Trail</text><text x="94" y="335" font-size="13" font-weight="500" fill="#63746C" font-family="Arial, sans-serif">3 devices found</text><rect x="24" y="372" width="342" height="72" rx="18" fill="#FFFFFF" stroke="#DDE4DA"/><rect x="40" y="388" width="40" height="40" rx="13" fill="#D9ED97" stroke="none"/><text x="60" text-anchor="middle" y="414" font-size="16" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">R</text><text x="94" y="401" font-size="16" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Lookout Route</text><text x="94" y="423" font-size="13" font-weight="500" fill="#63746C" font-family="Arial, sans-serif">1 device found</text><rect x="24" y="477" width="342" height="128" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="508" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Cannot find your group?</text><text x="42" y="537" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Move closer and check</text><text x="42" y="560" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Bluetooth. You can safely try again.</text><rect x="24" y="676" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="709" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Join Stone Trail</text><text x="136" y="752" font-size="14" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Refresh search</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="40" y="1069" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">DIRECTION: FOREST GREEN + LIME · CONTROLS ≥ 48 PX · EXPLICIT STATES · PROVISIONAL SANS-SERIF TYPE</text></svg>
