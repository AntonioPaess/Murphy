ante</text><text x="94" y="423" font-size="13" font-weight="500" fill="#63746C" font-family="Arial, sans-serif">1 aparelho detectado</text><rect x="24" y="477" width="342" height="128" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="508" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Não encontrou o grupo?</text><text x="42" y="537" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Aproxime os aparelhos e confira</text><text x="42" y="560" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">o Bluetooth. Tentar novamente é seguro.</text><rect x="24" y="676" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="709" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Entrar em Trilha da Pedra</text><text x="136" y="752" font-size="14" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Atualizar busca</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="40" y="1069" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">DIREÇÃO: VERDE FLORESTA + LIMA · CONTROLES ≥ 48 PX · ESTADOS EXPLÍCITOS · TIPOGRAFIA SANS-SERIF PROVISÓRIA</text></svg>
