l="#163D35" font-family="Arial, sans-serif">Antes de encerrar</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Confira as pendências do grupo.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Fluxo de encerramento é planejado.</text><rect x="24" y="224" width="342" height="36" rx="18" fill="#FFF0C9" stroke="none"/><text x="40" y="248" font-size="13" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Há 1 envio pendente no exemplo</text><rect x="24" y="280" width="342" height="125" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="311" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Histórico apenas em memória</text><text x="42" y="340" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Fechar a sessão pode perder este registro.</text><text x="42" y="363" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Exportação/persistência são planejadas.</text><rect x="24" y="427" width="342" height="125" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="458" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Pedido de ajuda ainda aberto?</text><text x="42" y="487" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Confirme com seu grupo antes de sair.</text><text x="42" y="510" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Encerrar não comunica um resgate.</text><rect x="24" y="636" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="669" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Continuar na sessão</text><rect x="24" y="710" width="342" height="54" rx="18" fill="#FFFFFF" stroke="none"/><text x="195" text-anchor="middle" y="743" font-size="16" font-weight="700" fill="#B63632