<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1100" viewBox="0 0 1740 1100"><rect x="0" y="0" width="1740" height="1100" rx="0" fill="#E7EBDF" stroke="none"/><text x="40" y="48" font-size="15" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">MURPHY / EXPERIÊNCIA OFFLINE</text><text x="40" y="87" font-size="30" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">03 — Mensagens e ajuda</text><text x="40" y="118" font-size="16" font-weight="500" fill="#63746C" font-family="Arial, sans-serif">Sem falsa confirmação ou promessa de resgate · Proposta visual · Dados ilustrativos · Não implementado</text><text x="40" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">09 · Conversa do grupo</text><g transform="translate(40 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="93" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">MENSAGENS</text><text x="24" y="136" font-size="28" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Trilha da Pedra</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Conversa e composição: proposta de UI.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Sem confirmação remota implementada.</text><rect x="24" y="222" width="292" height="101" rx="19" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="250" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">BIA · 14:32</text><text x="42" y="279" font-size="14" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Vamos esperar na próxima bifurcação.</text><rect x="80" y="350" width="286" height="110" rx="19" fill="#D9ED97" stroke="none"/><text x="98" y="383" font-size="14" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Estou chegando. Podem esperar?</text><text x="98" y="432" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Aceita pelo adapter · Não confirmada</text><rect x="80" y="483" width="286" height="94" rx="19" fill="#FFF0C9" stroke="none"/><text x="98" y="516" font-size="14" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Estou sem ver vocês.</text><text x="98" y="552" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Reenvio pendente · Tentativa 2 de 3</text><rect x="24" y="641" width="276" height="58" rx="18" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="675" font-size="14" font-weight="500" fill="#63746C" font-family="Arial, sans-serif">Escreva uma mensagem…</text><rect x="312" y="641" width="54" height="58" rx="18" fill="#163D35" stroke="none"/><text x="339" text-anchor="middle" y="675" font-size="23" font-weight="700" fill="#fff" font-family="Arial, sans-serif">↑</text><rect x="0" y="752" width="390" height="92" rx="0" fill="#FFFFFF" stroke="none"/><path d="M0 752H390" stroke="#DDE4DA"/><rect x="13" y="770" width="88" height="48" rx="14" fill="#FFFFFF" stroke="none"/><text x="57" text-anchor="middle" y="800" font-size="12" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Grupo</text><rect x="107" y="770" width="88" height="48" rx="14" fill="#FFFFFF" stroke="none"/><text x="151" text-anchor="middle" y="800" font-size="12" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Rede</text><rect x="201" y="770" width="88" height="48" rx="14" fill="#D9ED97" stroke="none"/><text x="245" text-anchor="middle" y="800" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Mensagens</text><rect x="295" y="770" width="88" height="48" rx="14" fill="#FFFFFF" stroke="none"/><text x="339" text-anchor="middle" y="800" font-size="12" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Histórico</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="462" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">10 · Sem vizinhos</text><g transform="translate(462 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="93" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">ENVIO SEM CONEXÃO</text><text x="24" y="136" font-size="28" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Ainda sem caminho</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Nenhum peer elegível está anexado.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Isso não prova destino inalcançável.</text><rect x="24" y="224" width="342" height="36" rx="18" fill="#FFF0C9" stroke="none"/><text x="40" y="248" font-size="13" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Sem vizinhos diretos</text><rect x="24" y="282" width="342" height="139" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="313" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Sua mensagem não foi enviada</text><text x="42" y="342" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">“Estou na bifurcação. Me avisem.”</text><text x="42" y="365" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">O rascunho nesta tela é planejado.</text><rect x="24" y="440" width="342" height="132" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="471" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">O que fazer agora</text><text x="42" y="500" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Aproxime-se do grupo e procure peers.</text><text x="42" y="523" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Depois, tente o envio novamente.</text><text x="24" y="614" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Sem rota não entra na fila atual.</text><text x="24" y="637" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Não exibimos “entregue” neste estado.</text><rect x="24" y="681" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="714" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Procurar peers</text><rect x="0" y="752" width="390" height="92" rx="0" fill="#FFFFFF" stroke="none"/><path d="M0 752H390" stroke="#DDE4DA"/><rect x="13" y="770" width="88" height="48" rx="14" fill="#FFFFFF" stroke="none"/><text x="57" text-anchor="middle" y="800" font-size="12" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Grupo</text><rect x="107" y="770" width="88" height="48" rx="14" fill="#FFFFFF" stroke="none"/><text x="151" text-anchor="middle" y="800" font-size="12" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Rede</text><rect x="201" y="770" width="88" height="48" rx="14" fill="#D9ED97" stroke="none"/><text x="245" text-anchor="middle" y="800" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Mensagens</text><rect x="295" y="770" width="88" height="48" rx="14" fill="#FFFFFF" stroke="none"/><text x="339" text-anchor="middle" y="800" font-size="12" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Histórico</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="884" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">11 · Confirmar SOS</text><g transform="translate(884 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="93" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">PEDIDO AO GRUPO</text><text x="24" y="136" font-size="28" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Precisa de ajuda?</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Envie um pedido para seus companheiros.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">SOS é uma função planejada.</text><rect x="24" y="222" width="342" height="143" rx="22" fill="#FBEAE6" stroke="none"/><text x="44" y="263" font-size="21" font-weight="700" fill="#B63632" font-family="Arial, sans-serif">SOS ≠ serviço de resgate</text><text x="44" y="297" font-size="14" font-weight="400" fill="#B63632" font-family="Arial, sans-serif">Não aciona emergência automaticamente.</text><text x="44" y="320" font-size="14" font-weight="400" fill="#B63632" font-family="Arial, sans-serif">Não garante envio ou recebimento.</text><rect x="24" y="390" width="342" height="122" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="421" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Mensagem do pedido</text><text x="42" y="450" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">“Preciso de ajuda. Tentem falar comigo.”</text><text x="42" y="473" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Sem localização automática neste fluxo.</text><rect x="24" y="530" width="342" height="113" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="561" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Antes de enviar</text><text x="42" y="590" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Confira o texto e os vizinhos disponíveis.</text><text x="42" y="613" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Se for possível, use um canal de resgate.</text><rect x="24" y="678" width="342" height="54" rx="18" fill="#B63632" stroke="none"/><text x="195" text-anchor="middle" y="711" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Enviar pedido ao grupo</text><text x="166" y="764" font-size="15" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">Cancelar</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="1306" y="161" font-size="15" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">12 · SOS em andamento</text><g transform="translate(1306 181)"><rect x="0" y="0" width="390" height="844" rx="26" fill="#F5F6EF" stroke="#DDE4DA"/><text x="24" y="31" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">9:41</text><text x="292" y="31" font-size="12" font-weight="500" fill="#163D35" font-family="Arial, sans-serif">BLE  ·  ▰</text><text x="24" y="93" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">PEDIDO DE AJUDA</text><text x="24" y="136" font-size="28" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Sem confirmação</text><text x="24" y="168" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">O pedido continua visível para você.</text><text x="24" y="191" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Não confunda tentativa com entrega.</text><rect x="24" y="222" width="342" height="36" rx="18" fill="#FFF0C9" stroke="none"/><text x="40" y="246" font-size="13" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Enviado ao adapter · Destino não confirmou</text><rect x="24" y="280" width="342" height="139" rx="22" fill="#B63632" stroke="none"/><text x="44" y="321" font-size="23" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Pedido de ajuda ativo</text><text x="44" y="354" font-size="14" font-weight="400" fill="#fff" font-family="Arial, sans-serif">“Preciso de ajuda. Tentem falar comigo.”</text><text x="44" y="377" font-size="14" font-weight="400" fill="#fff" font-family="Arial, sans-serif">14:38 · Exemplo de interface</text><rect x="24" y="443" width="342" height="124" rx="20" fill="#FFFFFF" stroke="#DDE4DA"/><text x="42" y="474" font-size="18" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Situação da mensagem</text><text x="42" y="503" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Bia: adapter aceitou.</text><text x="42" y="526" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Lia: falha de envio; reenvio elegível.</text><text x="24" y="604" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">ACK do destino ainda é planejado.</text><text x="24" y="627" font-size="14" font-weight="400" fill="#63746C" font-family="Arial, sans-serif">Se ninguém responder, tente outro canal.</text><rect x="24" y="672" width="342" height="54" rx="18" fill="#163D35" stroke="none"/><text x="195" text-anchor="middle" y="705" font-size="16" font-weight="700" fill="#fff" font-family="Arial, sans-serif">Ver tentativas</text><rect x="0" y="752" width="390" height="92" rx="0" fill="#FFFFFF" stroke="none"/><path d="M0 752H390" stroke="#DDE4DA"/><rect x="13" y="770" width="88" height="48" rx="14" fill="#FFFFFF" stroke="none"/><text x="57" text-anchor="middle" y="800" font-size="12" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Grupo</text><rect x="107" y="770" width="88" height="48" rx="14" fill="#FFFFFF" stroke="none"/><text x="151" text-anchor="middle" y="800" font-size="12" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Rede</text><rect x="201" y="770" width="88" height="48" rx="14" fill="#D9ED97" stroke="none"/><text x="245" text-anchor="middle" y="800" font-size="12" font-weight="700" fill="#163D35" font-family="Arial, sans-serif">Mensagens</text><rect x="295" y="770" width="88" height="48" rx="14" fill="#FFFFFF" stroke="none"/><text x="339" text-anchor="middle" y="800" font-size="12" font-weight="400" fill="#163D35" font-family="Arial, sans-serif">Histórico</text><rect x="136" y="826" width="118" height="4" rx="2" fill="#163D35"/></g><text x="40" y="1069" font-size="12" font-weight="700" fill="#63746C" font-family="Arial, sans-serif">DIREÇÃO: VERDE FLORESTA + LIMA · CONTROLES ≥ 48 PX · ESTADOS EXPLÍCITOS · TIPOGRAFIA SANS-SERIF PROVISÓRIA</text></svg>
